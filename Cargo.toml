[package]
name = "orbita"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
freya = { git = "https://github.com/SergioRibera/freya.git", branch = "hotreload", features = [
    "hotreload",
    "router",
    "icons",
] }
freya-components = { git = "https://github.com/SergioRibera/freya.git", branch = "hotreload" }

serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.6", features = [
    "runtime-async-std",
    "sqlite",
    "postgres",
    "mysql",
    "macros",
    "migrate",
] }
tokio = { version = "1.45.1", features = ["full"] }

[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
